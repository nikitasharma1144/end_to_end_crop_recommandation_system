{% extends 'base.html' %}

{% block title %}Admin Login{% endblock %}

{% block content %}
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="card-title mb-4">Admin Login</h2>
            <form method="post" action="{% url 'admin_login' %}">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">Username or Email</label>
                <input class="form-control" type="text" name="username" required aria-label="Username or Email">
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" required aria-label="Password">
              </div>
              <button class="btn btn-primary" type="submit">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
