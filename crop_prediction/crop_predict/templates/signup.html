{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
  <div class="container">
    <h2 class="mb-3">Sign Up</h2>
    <form method="post" action="{% url 'signup' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" type="text" name="username" required aria-label="Username">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" required aria-label="Email">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required aria-label="Password">
      </div>
      <button class="btn btn-success" type="submit">Create account</button>
    </form>
  </div>
{% endblock %}
